spring:
  application:
    name: reminder
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/reminder}
    username: ${SPRING_DATASOURCE_USERNAME:reminder}
    password: ${SPRING_DATASOURCE_PASSWORD:reminder}
  flyway:
    enabled: true
    locations: classpath:db/migration
    ignore-migration-patterns: "repeatable:missing"

server:
  port: ${PORT:8080}

remindy:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-key-must-be-32bytes!!}
  llm:
    api-key: ${GEMINI_API_KEY:}
    model: gemini-3.5-flash
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

logging:
  level:
    org.springframework.security: DEBUG
