spring:
  application:
    name: reminder
  datasource:
    url: jdbc:postgresql://localhost:5432/reminder
    username: reminder
    password: ${DB_PASSWORD:reminder}
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/seed

remindy:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-key-must-be-32bytes!!}
  llm:
    api-key: ${GEMINI_API_KEY:}
    model: gemini-3.5-flash

logging:
  level:
    org.springframework.security: DEBUG