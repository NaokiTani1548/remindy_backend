services:
  postgres:
    image: postgres:18
    container_name: reminder-postgres
    environment:
      POSTGRES_DB: reminder
      POSTGRES_USER: reminder
      POSTGRES_PASSWORD: reminder
      TZ: Asia/Tokyo
      PGTZ: Asia/Tokyo
    ports:
      - "5433:5432"
    volumes:
      - reminder-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reminder -d reminder"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  reminder-pgdata: